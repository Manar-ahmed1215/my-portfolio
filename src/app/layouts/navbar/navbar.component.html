<nav class="border-b px-4 py-4 sticky top-0 z-50 transition-colors duration-300"
  [ngClass]="isDarkMode() ? 'bg-slate-950 text-slate-200 border-slate-900' : 'bg-white text-slate-800 border-slate-200'">

  <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between">

    <a routerLink=""
      class="flex items-center gap-2 text-indigo-600 dark:text-indigo-400 hover:opacity-80 transition-opacity">
      <div class="bg-indigo-600 text-white p-2 rounded-lg shadow-md shadow-indigo-600/20">
        <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
          stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M17.25 6.75 22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3-4.5 16.5" />
        </svg>
      </div>
      <span
        class="font-extrabold text-xl tracking-wide bg-gradient-to-r from-indigo-600 via-purple-500 to-pink-500 bg-clip-text text-transparent dark:from-indigo-400 dark:to-pink-400">
        Manar Ahmed
      </span>
    </a>

    <div class="flex items-center gap-4 md:gap-8 order-2 md:order-3">

      <button (click)="toggleDarkMode()" id="theme-toggle-button"
        class="relative w-16 h-8 bg-slate-200 rounded-full transition-all duration-300 hover:ring-2 hover:ring-indigo-500/50 focus:outline-none"
        [ngClass]="isDarkMode() ? 'bg-slate-700' : 'bg-slate-200'" type="button">
        <span
          class="absolute top-1 left-1 w-6 h-6 bg-white rounded-full shadow-md flex items-center justify-center transition-all duration-300"
          [ngClass]="isDarkMode() ? 'translate-x-8 bg-slate-800' : 'translate-x-0 bg-white'">
          <i class="fa-solid fa-sun text-amber-500 text-sm transition-all duration-300"
            [ngClass]="isDarkMode() ? 'opacity-0 rotate-90 scale-0' : 'opacity-100 rotate-0 scale-100'"></i>

          <i class="fa-solid fa-moon text-indigo-400 text-sm absolute transition-all duration-300"
            [ngClass]="isDarkMode() ? 'opacity-100 rotate-0 scale-100' : 'opacity-0 -rotate-90 scale-0'"></i>
        </span>
      </button>

      <button (click)="toggleMenu()" type="button"
        class="md:hidden p-2 rounded-lg  text-slate-700  hover:bg-slate-100 dark:hover:bg-slate-900 focus:outline-none transition-colors">
        <svg class="w-6 h-6 stroke-slate-700 dark:stroke-slate-200" fill="none" viewBox="0 0 24 24">
          @if (!isMenuOpen()) {
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          } @else {
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          }
        </svg>
      </button>
    </div>

    <ul
      class="w-full md:w-auto md:flex items-center gap-6 text-sm font-medium order-3 md:order-2 transition-all duration-300 mt-4 md:mt-0"
      [ngClass]="isMenuOpen() ? 'flex flex-col items-start gap-4 pb-4 md:pb-0' : 'hidden md:flex'">

      <li class="w-full md:w-auto">
        <a href="#home" (click)="isMenuOpen.set(false)" [class.text-indigo-600]="activeSection() === 'home'"
          [class.border-indigo-500]="activeSection() === 'home'"
          class="block py-1 px-1 border-b-2 border-transparent transition-all">Home</a>
      </li>
      <li class="w-full md:w-auto">
        <a href="#about" (click)="isMenuOpen.set(false)" [class.text-indigo-600]="activeSection() === 'about'"
          [class.border-indigo-500]="activeSection() === 'about'"
          class="block py-1 px-1 border-b-2 border-transparent transition-all">About</a>
      </li>
      <li class="w-full md:w-auto">
        <a href="#skills" (click)="isMenuOpen.set(false)" [class.text-indigo-600]="activeSection() === 'skills'"
          [class.border-indigo-500]="activeSection() === 'skills'"
          class="block py-1 px-1 border-b-2 border-transparent transition-all">Skills</a>
      </li>
      <li class="w-full md:w-auto">
        <a href="#projects" (click)="isMenuOpen.set(false)" [class.text-indigo-600]="activeSection() === 'projects'"
          [class.border-indigo-500]="activeSection() === 'projects'"
          class="block py-1 px-1 border-b-2 border-transparent transition-all">Projects</a>
      </li>
      <li class="w-full md:w-auto">
        <a href="#experience" (click)="isMenuOpen.set(false)" [class.text-indigo-600]="activeSection() === 'experience'"
          [class.border-indigo-500]="activeSection() === 'experience'"
          class="block py-1 px-1 border-b-2 border-transparent transition-all">Experience</a>
      </li>
      <li class="w-full md:w-auto">
        <a href="#contact" (click)="isMenuOpen.set(false)" [class.text-indigo-600]="activeSection() === 'contact'"
          [class.border-indigo-500]="activeSection() === 'contact'"
          class="block py-1 px-1 border-b-2 border-transparent transition-all">Contact</a>
      </li>
    </ul>

  </div>
</nav>
