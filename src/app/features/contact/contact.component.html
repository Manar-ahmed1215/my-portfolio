<section id="contact" [ngClass]="bgClass()" class="py-20 px-6 transition-colors duration-500">

  <div class="max-w-4xl mx-auto text-center">
    <h2 [ngClass]="titleClass()" class="text-4xl font-bold mb-8 transition-colors relative">GET IN TOUCH
      <span class="absolute -bottom-3 left-1/2 -translate-x-1/2 w-12 h-1 bg-indigo-500 rounded-full mt-1"></span>
    </h2>

    <p [ngClass]="textMuted()" class="mb-12 transition-colors">I'm always open to new opportunities and collaborations.
      Let's build something great!</p>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">

      <div (click)="openGmail()" [ngClass]="cardClass()"
        class="cursor-pointer p-8 rounded-3xl border hover:border-indigo-500 transition-all duration-300 group text-left relative overflow-hidden shadow-sm hover:shadow-xl hover:shadow-indigo-500/5">

        <span
          class="absolute left-0 top-0 h-0 w-[3px] bg-gradient-to-b from-indigo-500 to-purple-500 transition-all duration-500 ease-out group-hover:h-full shadow-[0_0_12px_rgba(99,102,241,0.6)]"></span>
        <i
          class="fa-solid fa-envelope text-indigo-500 text-3xl mb-4 transition-all duration-300 group-hover:scale-110 group-hover:text-purple-400 group-hover:drop-shadow-[0_0_6px_rgba(168,85,247,0.5)]"></i>
        <h3 [ngClass]="titleClass()" class="font-bold text-xl">Email </h3>
        <p class="text-slate-500">mmony4544@gmail.com</p>
      </div>

      <a href="https://www.linkedin.com/in/manarahmedashour" target="_blank" [ngClass]="cardClass()"
        class="block p-8 rounded-3xl border hover:border-indigo-500 transition-all duration-300 group text-left relative overflow-hidden shadow-sm hover:shadow-xl hover:shadow-indigo-500/5">

        <span
          class="absolute right-0 top-0 h-0 w-[3px] bg-gradient-to-b from-indigo-500 to-pink-500 transition-all duration-500 ease-out group-hover:h-full shadow-[0_0_12px_rgba(99,102,241,0.6)]"></span>
        <i
          class="fa-brands fa-linkedin text-indigo-500 text-3xl mb-4 transition-all duration-300 group-hover:scale-110 group-hover:text-pink-400 group-hover:drop-shadow-[0_0_6px_rgba(244,63,94,0.5)]"></i>
        <h3 [ngClass]="titleClass()" class="font-bold text-xl">LinkedIn </h3>
        <p class="text-slate-500">Let's connect!</p>
      </a>
    </div>

    <div class="mt-8">
      <p [ngClass]="textMuted()" class="mb-4">You can also find my code on</p>
      <a href="https://github.com/Manar-ahmed1215" target="_blank"
        class="inline-flex items-center gap-2 text-indigo-500 hover:text-indigo-400 font-bold text-xl transition-all duration-300 hover:scale-105 hover:drop-shadow-[0_0_8px_rgba(99,102,241,0.6)] animate-pulse">
        <i class="fa-brands fa-github"></i> GitHub
      </a>
    </div>
  </div>
</section>
