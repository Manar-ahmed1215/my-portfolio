<section id="projects" [ngClass]="bgClass()" class="scroll-mt-28 py-16 md:py-20 px-4 md:px-6 transition-colors duration-500 overflow-hidden">

  <div class="max-w-7xl mx-auto">
    <h2 [ngClass]="titleClass()" class="text-3xl md:text-4xl font-bold text-center mb-12 transition-colors relative">
      MY Projects
      <span class="absolute -bottom-3 left-1/2 -translate-x-1/2 w-12 h-1 bg-indigo-500 rounded-full mt-1 shadow-[0_0_10px_rgba(99,102,241,0.8)]"></span>
    </h2>

    <!-- Scrollable Horizontal Categories on Mobile -->
    <div class="flex justify-start md:justify-center gap-3 mb-10 overflow-x-auto pb-2 scrollbar-none px-2">
      @for (cat of ['All', 'Website', 'Application', 'Design']; track cat) {
      <button (click)="setFilter(cat)" [class.bg-indigo-600]="filter() === cat"
        [class.shadow-[0_0_12px_rgba(99,102,241,0.5)]]="filter() === cat"
        [class.bg-slate-800]="isDarkMode() && filter() !== cat" 
        [class.bg-gray-200]="!isDarkMode() && filter() !== cat"
        [class.text-white]="isDarkMode() || filter() === cat" 
        [class.text-slate-800]="!isDarkMode() && filter() !== cat"
        class="px-5 py-2 rounded-full transition-all duration-300 active:scale-90 text-sm font-semibold whitespace-nowrap shrink-0">
        {{cat}}
      </button>
      }
    </div>

    <!-- Cards Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
      @for (p of filteredProjects(); track p.title) {
      <div [ngClass]="cardClass()" 
        class="mobile-card border rounded-2xl md:rounded-3xl overflow-hidden transition-all duration-300 flex flex-col relative group">

        <!-- Glowing Line -->
        <span class="glow-line absolute bottom-0 left-0 w-full h-[3px] bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 shadow-[0_0_10px_rgba(99,102,241,0.6)]"></span>
        
        <a [href]="p.previewLink" target="_blank" class="h-56 md:h-64 w-full overflow-hidden block relative">
          <img [src]="p.previewImage" [alt]="p.title"
            class="w-full h-full object-cover transition-transform duration-500 active:scale-105">
        </a>

        <div class="p-6 md:p-8 flex-grow flex flex-col justify-between">
          <div>
            <div class="flex justify-between items-start mb-3">
              <span class="px-3 py-1 bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-[10px] font-bold rounded-full uppercase tracking-wider">
                {{p.category}}
              </span>

              <div class="flex gap-2">
                <a [href]="p.githubLink" target="_blank"
                  class="p-2.5 bg-slate-800 text-white rounded-full active:bg-indigo-600 active:scale-90 transition-all duration-200">
                  <i class="fa-brands fa-github text-sm"></i>
                </a>
                <a [href]="p.previewLink" target="_blank"
                  class="p-2.5 bg-slate-800 text-white rounded-full active:bg-indigo-600 active:scale-90 transition-all duration-200">
                  <i class="fa-solid fa-eye text-sm"></i>
                </a>
              </div>
            </div>

            <h3 [ngClass]="titleClass()" class="text-lg md:text-xl font-bold mb-2 transition-colors">
              {{p.title}}
            </h3>
            <p [ngClass]="textMuted()" class="text-xs md:text-sm mb-6 transition-colors leading-relaxed">
              {{p.desc}}
            </p>
          </div>

          <div class="flex flex-wrap gap-1.5 md:gap-2 mt-auto">
            @for (tag of p.tags; track tag) {
            <span class="px-2.5 py-1 bg-slate-800/80 border border-slate-700/50 text-slate-300 text-[10px] rounded-full">
              {{tag}}
            </span>
            }
          </div>
        </div>
      </div>
      } @empty {
      <p class="text-slate-500 text-center col-span-full py-12">No projects found in this category.</p>
      }
    </div>
  </div>
</section>
